<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wyze Recorder</title>
    <link rel="stylesheet" href="record.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Wyze Recorder</h1>
      <div class="row">
        <button id="pickDir">Pick Folder</button>
        <button id="clearDir">Clear Folder</button>
      </div>
      <div class="row">
        <div id="dirStatus" class="status"></div>
      </div>
      <div class="row">
        <div id="lastSaved" class="status"></div>
      </div>
      <div class="note">
        Keep this tab open while recording to save files into the selected folder.
      </div>
    </div>
    <script src="record.js"></script>
  </body>
</html>
