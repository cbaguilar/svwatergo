# Drop-in replacement for the API section inside your existing:
# <VirtualHost *:443>
#   ServerName svwaternet.org
#   ...
# </VirtualHost>
#
# Keep your existing cert settings and your frontend rule:
#   ProxyPass / http://127.0.0.1:4200/
#   ProxyPassReverse / http://127.0.0.1:4200/
#
# Replace old 8080 API/websocket rules with this block.

<Proxy "balancer://svwatergo-api-default">
    BalancerMember "http://127.0.0.1:28080" connectiontimeout=3 timeout=60 retry=1
    BalancerMember "http://127.0.0.1:18080" status=+H connectiontimeout=3 timeout=60 retry=1
    ProxySet lbmethod=byrequests failonstatus=500,502,503,504
</Proxy>

<Proxy "balancer://svwatergo-api-dev">
    BalancerMember "http://127.0.0.1:18080" connectiontimeout=3 timeout=60 retry=1
    ProxySet lbmethod=byrequests
</Proxy>

RewriteEngine On

# WebSocket stream: explicit dev override (header or query)
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{REQUEST_URI} ^/api/v1/sites/[^/]+/state/stream$
RewriteCond %{HTTP:X-SVWater-Backend} =dev [NC,OR]
RewriteCond %{QUERY_STRING} (^|&)backend=dev(&|$) [NC]
RewriteRule ^/api/v1/sites/[^/]+/state/stream$ balancer://svwatergo-api-dev%{REQUEST_URI} [P,L]

# WebSocket stream: default real backend with fallback to dev
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{REQUEST_URI} ^/api/v1/sites/[^/]+/state/stream$
RewriteRule ^/api/v1/sites/[^/]+/state/stream$ balancer://svwatergo-api-default%{REQUEST_URI} [P,L]

# HTTP API explicit dev override
RewriteCond %{REQUEST_URI} ^/api/
RewriteCond %{HTTP:X-SVWater-Backend} =dev [NC,OR]
RewriteCond %{QUERY_STRING} (^|&)backend=dev(&|$) [NC]
RewriteRule ^/api/(.*)$ balancer://svwatergo-api-dev/api/$1 [P,L]

# HTTP API default real backend with fallback to dev
ProxyPass /api/ balancer://svwatergo-api-default/api/ retry=0 timeout=60
ProxyPassReverse /api/ balancer://svwatergo-api-default/api/
ProxyPassReverse /api/ balancer://svwatergo-api-dev/api/
