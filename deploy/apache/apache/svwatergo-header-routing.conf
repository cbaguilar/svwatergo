# Apache vhost with header routing and automatic prod->dev failover.
#
# Default path:
#   client -> real-data backend (127.0.0.1:28080)
#   if real-data is down/unhealthy, Apache falls back to dev backend (127.0.0.1:18080)
#
# Forced dev path:
#   send header "X-SVWater-Backend: dev" OR query string "backend=dev" to always route to dev.

<VirtualHost *:80>
    ServerName api.svwaternet.org

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Ensure backend sees original scheme and client IP context.
    RequestHeader set X-Forwarded-Proto "http"

    # Balancer for normal traffic: real-data primary, dev hot-standby fallback.
    <Proxy "balancer://svwatergo-real-fallback">
        BalancerMember "http://127.0.0.1:28080" connectiontimeout=3 timeout=60 retry=1
        BalancerMember "http://127.0.0.1:18080" status=+H connectiontimeout=3 timeout=60 retry=1
        ProxySet lbmethod=byrequests failonstatus=500,502,503,504
    </Proxy>

    # Balancer for explicit dev routing.
    <Proxy "balancer://svwatergo-dev-only">
        BalancerMember "http://127.0.0.1:18080" connectiontimeout=3 timeout=60 retry=1
        ProxySet lbmethod=byrequests
    </Proxy>

    RewriteEngine On

    # Explicit override: send requests to dev by header or query hint.
    RewriteCond %{HTTP:X-SVWater-Backend} =dev [NC,OR]
    RewriteCond %{QUERY_STRING} (^|&)backend=dev(&|$) [NC]
    RewriteRule ^/(.*)$ balancer://svwatergo-dev-only/$1 [P,L]

    # Default: real-data with automatic failover to dev.
    RewriteRule ^/(.*)$ balancer://svwatergo-real-fallback/$1 [P,L]

    ProxyPassReverse / "balancer://svwatergo-dev-only/"
    ProxyPassReverse / "balancer://svwatergo-real-fallback/"

    ErrorLog ${APACHE_LOG_DIR}/svwatergo-error.log
    CustomLog ${APACHE_LOG_DIR}/svwatergo-access.log combined
</VirtualHost>

