# Drop this inside your existing TLS vhost after the Let's Encrypt cert lines.
#
# Required once per vhost:
#   SSLCACertificateFile /etc/apache2/ssl/upload-client-ca.pem
#   SSLVerifyClient optional
#   SSLVerifyDepth 2
#   SSLOptions +StdEnvVars +ExportCertData
#
# This protects only the probe route so you can validate mTLS before
# enforcing it on production ingest endpoints.

<Location /api/v1/ingest/mtls-probe>
    SSLVerifyClient require
    Require ssl-verify-client

    # Forward verified client identity for backend logging or future allowlists.
    RequestHeader set X-Client-Verify "%{SSL_CLIENT_VERIFY}s"
    RequestHeader set X-Client-DN "%{SSL_CLIENT_S_DN}s"
    RequestHeader set X-Client-Issuer "%{SSL_CLIENT_I_DN}s"
    RequestHeader set X-Client-Serial "%{SSL_CLIENT_M_SERIAL}s"
</Location>
